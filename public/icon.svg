<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (deep editorial blue) -->
  <rect width="1024" height="1024" rx="220" fill="#0B2545"/>

  <!-- Subtle gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#133A6F"/>
      <stop offset="100%" stop-color="#081A33"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#grad)" opacity="0.6"/>

  <!-- Main initials -->
  <text 
    x="50%" 
    y="44%" 
    text-anchor="middle" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="300" 
    font-weight="700" 
    fill="#FFFFFF">
    NW
  </text>

  <!-- Subtitle -->
  <text 
    x="50%" 
    y="65%" 
    text-anchor="middle" 
    font-family="SF Pro, Helvetica, Arial, sans-serif" 
    font-size="140" 
    font-weight="600" 
    fill="#F59E0B">
    Times
  </text>
</svg>